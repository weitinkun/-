name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get website files
        uses: actions/checkout@v4
      - name: Prepare site paths
        run: |
          cp -a site _site
          python3 - <<'PY'
          from pathlib import Path

          root = Path('_site')
          for path in (root / 'index.html', *root.glob('assets/*.js')):
              content = path.read_text(encoding='utf-8')
              for directory in ('assets', 'images', 'media', 'video'):
                  content = content.replace(f'/{directory}/', f'/-/{directory}/')
              content = content.replace('/favicon.svg', '/-/favicon.svg')
              path.write_text(content, encoding='utf-8')
          (root / '.nojekyll').touch()
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
